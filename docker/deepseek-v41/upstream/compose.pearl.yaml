# Add to compose.yaml for the isolated eager projection with public inputs.
services:
  deepseek:
    volumes:
      - type: bind
        source: ${PEARL_CONTROL_DIR:?private directory containing broker.sock}
        target: /run/pearl
        read_only: true
        bind: {create_host_path: false}
    environment:
      PEARL_BROKER_SOCKET: /run/pearl/broker.sock
      PEARL_PUBLIC_REPLAY: "1"
      PEARL_WOB_MODULE: checkpoint_projection
      PEARL_GPU_PREPARE: "1"
      PEARL_REPLAY_POOL_PORT: ${PEARL_REPLAY_POOL_PORT:-}
