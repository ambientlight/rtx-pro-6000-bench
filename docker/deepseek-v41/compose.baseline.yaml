# Local paths/identity only; inference settings match pinned 0xSero compose.yaml.
name: dsv41-sero-baseline
services:
  deepseek:
    build:
      context: /mnt/hot/ambientlight/repos/deepseek-v4.1-flash-4x-rtx-pro-6000
    image: ambientlight/dsv41-sm120:sero-45f538a-baseline
    container_name: dsv41-baseline
    gpus: all
    ipc: host
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: {soft: -1, hard: -1}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - /mnt/hot/ambientlight/models/DeepSeek-V4.1-Flash:/models/DeepSeek-V4.1-Flash
      - /mnt/hot/dsv41_state/sero-baseline:/state
      - kernel-cache:/root/.cache
    environment:
      OFFLOAD_MODE: "nvme"
      DSV41_CACHE_GIB: "64"
      CONTEXT_LENGTH: "409600"
      CHUNKED_PREFILL_SIZE: "2048"
      MEMORY_FRACTION: "0.85"
      MAX_RUNNING_REQUESTS: "8"
      MAX_TOTAL_TOKENS: ""
      API_KEY: ""
    # Explicitly manual during qualification; V12 containers remain stopped,
    # intact, with their original policies for a straightforward rollback.
    restart: "no"
volumes:
  kernel-cache:
