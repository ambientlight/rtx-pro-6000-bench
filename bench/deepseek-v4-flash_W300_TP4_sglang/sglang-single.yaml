# DeepSeek-V4-Flash — low-concurrency long-context thinking eval (sm_120).
# Launch via launch-single.sh (sets the SM120 + thinking env).

model-path: /mnt/hot/ambientlight/models/DeepSeek-V4-Flash
served-model-name: deepseek-v4-flash
host: 0.0.0.0
port: 8000
trust-remote-code: true

tensor-parallel-size: 4
pipeline-parallel-size: 1

context-length: 1048576    # full 1M
max-running-requests: 16
chunked-prefill-size: 8192
page-size: 256

kv-cache-dtype: fp8_e4m3

# Tightest corner: 0.90 + 1M + mrr 16. If it OOMs, drop chunked-prefill to 4096, then static to 0.85.
mem-fraction-static: 0.90

# SM120 safety fallbacks; MXFP4 experts still run FlashInfer launch_sm120_moe.
moe-runner-backend: triton
dsa-topk-backend: torch

cuda-graph-max-bs: 16
cuda-graph-bs: [1, 2, 4, 8, 16]
disable-custom-all-reduce: true
disable-shared-experts-fusion: true

enable-metrics: true
watchdog-timeout: 3600
log-level: info
